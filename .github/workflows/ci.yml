name: Build, concurrency tests, and secrets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Adminbot.sln
      - run: dotnet build Adminbot.sln -c Release --no-restore
      - run: dotnet test Adminbot.Tests/Adminbot.Tests.csproj -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet publish -c Release -f net10.0 -r linux-x64 --self-contained false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-test-results
          path: artifacts/tests
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan committed source with redacted findings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scan-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-source"
          "$(go env GOPATH)/bin/gitleaks" dir "$RUNNER_TEMP/scan-source" --redact=100 --no-banner
      - name: Audit historical exposure on explicit manual runs
        if: github.event_name == 'workflow_dispatch'
        run: '"$(go env GOPATH)/bin/gitleaks" git . --redact=100 --no-banner'
