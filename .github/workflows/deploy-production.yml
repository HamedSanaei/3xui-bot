name: Deploy production

# Production deployment of an artifact that GitHub Actions already built, tested, migration-checked, and packaged.
# The production host never runs dotnet restore, build, test, or publish: it receives a digest-verified release archive,
# validates it, preflights migrations against copies of the live databases, switches the release atomically, restarts the
# service, and rolls back automatically when the restarted service does not become healthy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /root/vpnetiran
  SERVICE_NAME: vpnetiranbot.service
  INCOMING_BASE: /root/.deploy/incoming
  RELEASE_ARTIFACT_NAME: vpnetiranbot-release

jobs:
  # Reuses the exact CI pipeline that any pull request runs, so a release cannot be packaged by a different set of steps
  # than the ones reviewers and the branch protection rule already trust.
  ci:
    if: github.ref == 'refs/heads/main'
    name: Build verified release
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy prebuilt release
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/release

      - name: Verify artifact digest from the CI job
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.ci.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "The CI job did not report a usable artifact digest." >&2; exit 64; }
          archive="$RUNNER_TEMP/release/${{ env.RELEASE_ARTIFACT_NAME }}.tar.gz"
          [[ -f "$archive" ]] || { echo "The downloaded release artifact is missing." >&2; exit 64; }
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$archive" | sha256sum -c -
          echo "ARTIFACT_DIGEST=$EXPECTED_DIGEST" >> "$GITHUB_ENV"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for required in PROD_HOST PROD_PORT PROD_USER PROD_SSH_KEY PROD_KNOWN_HOSTS; do
            [[ -n "${!required:-}" ]] || { echo "Missing required GitHub secret: $required" >&2; exit 64; }
          done
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/prod_deploy_key"
          chmod 600 "$RUNNER_TEMP/prod_deploy_key"

          raw_known_hosts="$RUNNER_TEMP/prod_known_hosts_raw"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$raw_known_hosts"
          target_known_host="$PROD_HOST"
          if [[ "$PROD_PORT" != "22" ]]; then
            target_known_host="[$PROD_HOST]:$PROD_PORT"
          fi
          : > "$HOME/.ssh/known_hosts"
          parsed_keys=0
          while read -r first second third _; do
            [[ -z "${first:-}" || "$first" == \#* ]] && continue
            if [[ "$first" == ssh-* || "$first" == ecdsa-* || "$first" == sk-* ]]; then
              key_type="$first"
              key_value="${second:-}"
            elif [[ "$second" == ssh-* || "$second" == ecdsa-* || "$second" == sk-* ]]; then
              key_type="$second"
              key_value="${third:-}"
            else
              echo "PROD_KNOWN_HOSTS contains an unsupported line format." >&2
              exit 64
            fi
            [[ -n "$key_value" ]] || { echo "PROD_KNOWN_HOSTS contains an incomplete key line." >&2; exit 64; }
            printf '%s %s %s\n' "$target_known_host" "$key_type" "$key_value" >> "$HOME/.ssh/known_hosts"
            parsed_keys=$((parsed_keys + 1))
          done < "$raw_known_hosts"
          [[ "$parsed_keys" -gt 0 ]] || { echo "PROD_KNOWN_HOSTS contains no usable host key." >&2; exit 64; }
          chmod 600 "$HOME/.ssh/known_hosts"
          rm -f -- "$raw_known_hosts"
          ssh-keygen -F "$target_known_host" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Normalized production host key entry could not be verified." >&2
            exit 64
          }

      - name: Transfer release artifact to production
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/release/${{ env.RELEASE_ARTIFACT_NAME }}.tar.gz"
          remote_dir="${{ env.INCOMING_BASE }}/$GITHUB_SHA"
          ssh -i "$RUNNER_TEMP/prod_deploy_key" -p "$PROD_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$PROD_USER@$PROD_HOST" "install -d -m 700 '$remote_dir'"
          scp -i "$RUNNER_TEMP/prod_deploy_key" -P "$PROD_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$archive" "$PROD_USER@$PROD_HOST:$remote_dir/${{ env.RELEASE_ARTIFACT_NAME }}.tar.gz"
          echo "Transferred $archive to $remote_dir on production."

      - name: Deploy exact pushed commit from the verified artifact
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          remote_artifact="${{ env.INCOMING_BASE }}/$GITHUB_SHA/${{ env.RELEASE_ARTIFACT_NAME }}.tar.gz"
          remote_cmd="$(printf 'bash -s -- %q %q %q %q %q %q %q' \
            "$GITHUB_SHA" "$remote_artifact" "$ARTIFACT_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ env.DEPLOY_PATH }}" "${{ env.SERVICE_NAME }}")"
          ssh -i "$RUNNER_TEMP/prod_deploy_key" -p "$PROD_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$PROD_USER@$PROD_HOST" "$remote_cmd" \
            < scripts/deploy-production.sh

      # The host removes the archive itself after a healthy deployment; this clears the incoming directory either way so a
      # cancelled or failed transfer cannot accumulate unreferenced release archives on the server.
      - name: Clear transferred artifact from production
        if: always()
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUNNER_TEMP/prod_deploy_key" ]]; then
            ssh -i "$RUNNER_TEMP/prod_deploy_key" -p "$PROD_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -- "$PROD_USER@$PROD_HOST" "rm -rf -- '${{ env.INCOMING_BASE }}/$GITHUB_SHA'" || true
          fi

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/prod_deploy_key" "$RUNNER_TEMP/prod_known_hosts_raw"
